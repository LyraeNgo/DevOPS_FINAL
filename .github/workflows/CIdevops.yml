name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup Node + cache
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install
      - run: npm install

      # 4. Lint
      - run: npm run lint

      # 5. Test
      - run: npm test

      # 6. Security scan (Snyk)
      - name: Snyk Scan
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 7. Build
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Login Docker Hub
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Build image
      - run: docker build -t myapp .

      # Scan LOCAL image (FIX)
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp
          exit-code: 1
          severity: CRITICAL,HIGH
        env:
          TRIVY_TIMEOUT: 1m

      # Tag
      - run: docker tag myapp mydocker/myapp:${{ github.sha }}

      # Push
      - run: docker push mydocker/myapp:${{ github.sha }}