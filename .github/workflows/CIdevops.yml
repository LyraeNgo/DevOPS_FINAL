name: cicd_full_devops

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

# ================= CI =================
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security scan (Snyk)
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build
        run: npm run build


# ================= DOCKER =================
  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker image
        run: |
          docker build -t hieuduong1/myapp:${{ github.sha }} .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.16.0
        with:
          image-ref: hieuduong1/myapp:${{ github.sha }}
          exit-code: 1
          severity: CRITICAL
          scanners: vuln

      - name: Push image
        run: |
          docker push hieuduong1/myapp:${{ github.sha }}


# ================= CD =================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      # Apply base config
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/

      # Update image (rolling update)
      - name: Deploy new version
        run: |
          kubectl set image deployment/myapp \
          web-container=hieuduong1/myapp:${{ github.sha }}

      # Check rollout + AUTO ROLLBACK
      - name: Verify rollout (auto rollback if fail)
        run: |
          kubectl rollout status deployment/myapp || \
          (echo "❌ Rollout failed → rolling back..." && \
           kubectl rollout undo deployment/myapp && exit 1)

      # Show rollout history (bonus điểm)
      - name: Show rollout history
        run: |
          kubectl rollout history deployment/myapp

      # Debug pods
      - name: Show pods
        run: |
          kubectl get pods -o wide