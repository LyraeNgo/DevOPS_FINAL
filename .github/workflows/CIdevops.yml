name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      # Install (CI chuẩn)
      - run: npm ci

      - run: npm run lint
      - run: npm test

      # Snyk scan
      - name: Snyk Scan
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - run: npm run build


      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: .


  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Login Docker Hub
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Build + đặt tên chuẩn ngay từ đầu
      - run: docker build -t hieuduong1/myapp:${{ github.sha }} .

      # Scan image LOCAL
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hieuduong1/myapp:${{ github.sha }}
          exit-code: 1
          severity: CRITICAL
          scanners: vuln
        env:
          TRIVY_TIMEOUT: 5m

      # Push
      - run: docker push hieuduong1/myapp:${{ github.sha }}