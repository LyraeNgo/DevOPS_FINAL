name: cicd_full_devops

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
# ================= CI =================
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Snyk Scan
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - run: npm run build


# ================= DOCKER =================
  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Build + tag
      - name: Build image
        run: |
          docker build --no-cache -t hieuduong1/myapp:${{ github.sha }} .
          docker tag hieuduong1/myapp:${{ github.sha }} hieuduong1/myapp:latest

      # Trivy scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          image-ref: hieuduong1/myapp:${{ github.sha }}
          exit-code: 1
          severity: CRITICAL
          scanners: vuln

      # Push
      - name: Push image
        run: |
          docker push hieuduong1/myapp:${{ github.sha }}
          docker push hieuduong1/myapp:latest


# ================= CD =================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            docker pull hieuduong1/myapp:latest
            docker-compose down
            docker-compose up -d